# onejev-decide — aggressive latency (RTX 3050)

model:
  gguf: "mradermacher/OneJev1.6-0.8B-GGUF:IQ4_XS"
  server_url: "http://127.0.0.1:8000"
  port: 8000
  timeout_s: 60
  retries: 1
  max_branch_tokens: 1536
  max_request_tokens: 3072

inference:
  max_image_side: 320
  jpeg_quality: 75
  debias: 0
  image_min_tokens: 64
  image_max_tokens: 128
  mtmd_batch_max_tokens: 128
  max_pixels: 102400
  warmup: true

paths:
  data: data
  normal: data/normal
  incident: data/incident
  outputs: outputs

task:
  name: "Monitor waste containers for overflow"
  view: "<image:1>"

questions:
  overflow:
    type: noul
    instructions: >-
      The waste bin or dumpster is overflowing or overfilled:
      trash bags or debris piled above the rim, spilling out,
      or the lid forced open/propped up by trash on top.

thresholds:
  overflow:
    noul: 0.55
