[project]
name = "onejev-decide"
version = "0.1.0"
description = "Config-driven typed visual decisions with OneJev"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx",
  "pillow",
  "PyYAML>=6.0",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[tool.setuptools.packages.find]
include = ["onejev_decide*"]

[tool.uv]
package = false
