<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Playground</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1b1b1b; --muted:#6b6b6b; --card:#fff; --line:#e3e3df; --acc:#2f6f4f; --bar:#8fd3ae; --warn:#c0392b; --ok:#2f6f4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --fg:#eaeaea; --muted:#9a9a9a; --card:#1e1e1e; --line:#333; --acc:#7cc79d; --bar:#2f6f4f; --ok:#7cc79d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  textarea, select {
    width:100%; font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
  }
  textarea { min-height:160px; resize:vertical; }
  button {
    background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .drop {
    border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--muted);
    cursor:pointer; background:var(--bg); min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .drop.drag { border-color:var(--acc); color:var(--acc); }
  .drop img { max-width:100%; max-height:280px; border-radius:8px; object-fit:contain; }
  .ans { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .ans h3 { margin:0 0 6px; font-size:14px; }
  .ans .kind { color:var(--muted); font-weight:400; margin-left:6px; }
  .bar { display:grid; grid-template-columns: 160px 1fr 56px; gap:8px; align-items:center; margin:3px 0; }
  .bar .track { height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--bar); }
  .bar .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .err { color:var(--warn); white-space:pre-wrap; }
  .badge {
    display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; letter-spacing:.02em;
  }
  .badge.ok { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
  .badge.alarm { background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .timing {
    display:flex; gap:12px; flex-wrap:wrap; align-items:baseline;
    margin:10px 0 4px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg);
  }
  .timing .t { font:600 22px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .timing .u { color:var(--muted); font-size:12px; }
  code { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
  .samples { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .samples button { padding:6px 10px; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Decision Playground</h1>
  <p class="sub">Carica un’immagine, valuta le domande tipizzate da <code>config.yaml</code> (stesso flusso di <code>decide</code>).</p>

  <div class="grid">
    <div class="card">
      <label>Immagine</label>
      <div class="drop" id="drop" tabindex="0">
        <span id="dropHint">Trascina qui, clicca per scegliere, oppure usa un sample</span>
        <img id="preview" alt="" hidden>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="samples" id="samples"></div>

      <label style="margin-top:14px" for="task">Task</label>
      <textarea id="task" rows="2"></textarea>

      <label style="margin-top:12px" for="questions">Questions (JSON)</label>
      <textarea id="questions"></textarea>

      <div class="row">
        <button id="run">Evaluate</button>
        <button class="ghost" id="reload" type="button">Ricarica config</button>
        <span id="status" class="meta"></span>
      </div>
    </div>

    <div class="card">
      <label>Risultato</label>
      <div id="out"><span class="meta">Niente ancora.</span></div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let selectedFile = null;

function bars(probs) {
  return Object.entries(probs).map(([k, v]) => {
    const p = Number(v);
    return `<div class="bar"><span class="lbl" title="${k}">${k}</span><div class="track"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div><span>${p.toFixed(3)}</span></div>`;
  }).join("");
}

function setPreview(url, name) {
  const img = $("preview");
  img.src = url;
  img.hidden = false;
  $("dropHint").textContent = name || "immagine selezionata";
}

function pickFile(file) {
  if (!file) return;
  selectedFile = file;
  setPreview(URL.createObjectURL(file), file.name);
}

$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => pickFile(e.target.files[0]));
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("drag"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("drag"); }));
$("drop").addEventListener("drop", e => pickFile(e.dataTransfer.files[0]));

async function loadConfig() {
  const r = await fetch("/api/config");
  const cfg = await r.json();
  $("task").value = cfg.task?.name || "";
  $("questions").value = JSON.stringify(cfg.questions || {}, null, 2);
  const box = $("samples");
  box.innerHTML = "";
  (cfg.samples || []).forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ghost";
    b.textContent = s.label;
    b.onclick = async () => {
      const res = await fetch(s.url);
      const blob = await res.blob();
      pickFile(new File([blob], s.name, { type: blob.type || "image/jpeg" }));
    };
    box.appendChild(b);
  });
}

function renderAnswers(data, roundTripMs) {
  const stato = data.stato === "allarme" ? "alarm" : "ok";
  const sec = data.seconds != null ? Number(data.seconds) : (roundTripMs / 1000);
  const ms = Math.round(sec * 1000);
  let html = `<div><span class="badge ${stato}">${data.stato}</span></div>`;
  html += `<div class="timing"><span class="t">${sec.toFixed(2)}s</span><span class="u">inferenza end-to-end (${ms} ms)</span></div>`;
  const answers = data.answers || {};
  for (const [id, a] of Object.entries(answers)) {
    if (a.type === "noul") {
      html += `<div class="ans"><h3>${id}<span class="kind">noul</span></h3>${bars({ yes: a.value, no: 1 - a.value })}</div>`;
    } else if (a.type === "score") {
      const probs = a.probabilities || {};
      const legend = Object.keys(probs).length ? bars(probs) : `<div class="meta">score ${a.value}${a.label ? " → " + a.label : ""}</div>`;
      html += `<div class="ans"><h3>${id}<span class="kind">score: <b>${a.value}</b>${a.label ? " (" + a.label + ")" : ""}</span></h3>${legend}</div>`;
    } else if (a.type === "choice") {
      html += `<div class="ans"><h3>${id}<span class="kind">choice: <b>${a.value}</b></span></h3>${a.probabilities ? bars(a.probabilities) : ""}</div>`;
    } else {
      html += `<div class="ans"><h3>${id}</h3><pre>${JSON.stringify(a, null, 2)}</pre></div>`;
    }
  }
  html += `<div class="meta">${data.file || ""}</div>`;
  return html;
}

async function run() {
  const btn = $("run"), out = $("out"), st = $("status");
  if (!selectedFile) { out.innerHTML = `<div class="err">Seleziona un’immagine.</div>`; return; }
  let questions;
  try { questions = JSON.parse($("questions").value); }
  catch (e) { out.innerHTML = `<div class="err">questions JSON non valido: ${e.message}</div>`; return; }

  const fd = new FormData();
  fd.append("image", selectedFile);
  fd.append("task", $("task").value);
  fd.append("questions", JSON.stringify(questions));

  btn.disabled = true; st.textContent = "evaluating..."; out.innerHTML = `<span class="meta">in corso…</span>`;
  const t0 = performance.now();
  try {
    const r = await fetch("/api/decide", { method: "POST", body: fd });
    const roundTripMs = performance.now() - t0;
    const data = await r.json();
    if (!r.ok) { out.innerHTML = `<div class="err">${r.status}: ${data.detail || JSON.stringify(data)}</div>`; return; }
    if (data.seconds == null) data.seconds = roundTripMs / 1000;
    st.textContent = `${Number(data.seconds).toFixed(2)}s`;
    out.innerHTML = renderAnswers(data, roundTripMs);
  } catch (e) {
    out.innerHTML = `<div class="err">${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

$("run").addEventListener("click", run);
$("reload").addEventListener("click", () => loadConfig().catch(e => { $("out").innerHTML = `<div class="err">${e.message}</div>`; }));
loadConfig().catch(e => { $("out").innerHTML = `<div class="err">Config: ${e.message}. Avvia scripts/ui.py</div>`; });
</script>
</body>
</html>
